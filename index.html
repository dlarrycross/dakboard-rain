<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Larry's Rain Center</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <div id="title">
        🌧 Larry's Rain Center
    </div>

    <div id="location">
        Lewis Center, Ohio
    </div>

    <div id="rainContainer">

        <div id="rainValue">

            --.-"

        </div>

        <div id="rainLabel">

            Rain Today

        </div>

    </div>

    <div class="row">

        <div class="label">
            Status
        </div>

        <div id="status">
            Loading...
        </div>

    </div>

    <div class="row">

        <div class="label">
            Temperature
        </div>

        <div id="temp">

            --

        </div>

    </div>

    <div class="row">

        <div class="label">

            Humidity

        </div>

        <div id="humidity">

            --

        </div>

    </div>

    <div class="row">

        <div class="label">

            Wind

        </div>

        <div id="wind">

            --

        </div>

    </div>

    <div id="updated">

        Updating...

    </div>

</div>

<script src="config.js"></script>
<script src="script.js"></script>

</html>
