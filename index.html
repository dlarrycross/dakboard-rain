<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rain</title>

</head>

<body>

<div id="app">

    <div id="title">
        RAIN
    </div>

    <div id="location">
       Lewis Center, Ohio
</div>

<div id="rainContainer">

    <svg id="rainGauge" viewBox="0 0 120 240">

<!-- Glass tube -->

<rect
    x="40"
    y="20"
    width="40"
    height="170"
    rx="20"
    ry="20"
    fill="none"
    stroke="#9fdcff"
    stroke-width="4"/>

<!-- Glass highlight -->

<rect
    x="46"
    y="24"
    width="5"
    height="160"
    rx="3"
    fill="rgba(255,255,255,0.35)"/>

        <!-- Water -->
<defs>

    <linearGradient id="waterGradient"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

        <stop offset="0%" stop-color="#7fd8ff"/>
        <stop offset="100%" stop-color="#1d7fd8"/>

    </linearGradient>

</defs>
        <rect
            id="waterLevel"
            x="42"
            y="185"
            width="36"
            height="0"
            rx="14"
            fill="url(#waterGradient)"/>

        <!-- Bulb -->

        <circle
            cx="60"
            cy="205"
            r="25"
            fill="none"
            stroke="#9fd6ff"
stroke-opacity="0.85"
            stroke-width="4"/>

        <circle
            id="waterBulb"
            cx="60"
            cy="205"
            r="21"
            stroke="#9fd6ff"
stroke-opacity="0.85"
            fill="url(#waterGradient)"/>

    </svg>

    <div id="rainValue">

        --.-"

    </div>

    <div id="rainLabel">

        TODAY

    </div>

</div>
