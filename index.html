<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rain Guage</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <div id="title">
        🌧 Rain Guage
    </div>

    <div id="location">
       Lewis Center, Ohio
</div>

<div id="rainContainer">

    <svg id="rainGauge" viewBox="0 0 120 240">

        <!-- Glass tube -->

        <rect
            x="40"
            y="20"
            width="40"
            height="170"
            rx="18"
            ry="18"
            fill="none"
            stroke="#8ac7ff"
            stroke-width="4"/>

        <!-- Water -->

        <rect
            id="waterLevel"
            x="42"
            y="185"
            width="36"
            height="0"
            rx="14"
            fill="#2196f3"/>

        <!-- Bulb -->

        <circle
            cx="60"
            cy="205"
            r="25"
            fill="none"
            stroke="#8ac7ff"
            stroke-width="4"/>

        <circle
            id="waterBulb"
            cx="60"
            cy="205"
            r="21"
            fill="#2196f3"/>

    </svg>

    <div id="rainValue">

        --.-"

    </div>

    <div id="rainLabel">

        Today

    </div>

</div>
